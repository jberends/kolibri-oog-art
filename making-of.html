<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Het ontstaan van ‘De kolibrie en het oog’ — van eerste opzet tot ingelijst werk.">
  <title>Het ontstaan — De kolibrie en het oog</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Jochem · Houtskool op papier</div>
      <h1>Het ontstaan</h1>
    </header>

    <article aria-label="Inleiding">
      <p>Van een leeg vel tot een oog dat terugkijkt. Laag over laag houtskool.</p>
    </article>

    <figure class="step">
      <span class="eyebrow">De tafel</span>
      <img src="assets/kolibri-oog-makingof-3.jpeg" alt="Werktafel met potloden, houtskool" loading="lazy">
      <figcaption>Potloden, houtskool en referenties</figcaption>
    </figure>

    <figure class="step">
      <span class="eyebrow">De eerste opzet</span>
      <img src="assets/kolibri-oog-makingof-2.jpeg" alt="De tekening in een vroeg stadium: de iris en de bovenste ooglijn zijn aangezet" loading="lazy">
      <figcaption>Het oog krijgt vorm, met de referentie ernaast</figcaption>
    </figure>

    <figure class="step">
      <span class="eyebrow">De diepte</span>
      <img src="assets/kolibri-oog-makingof-1.jpeg" alt="De tekening verder uitgewerkt, met donkere schaduwen en de eerste kolibrie" loading="lazy">
      <figcaption>Schaduw, adertjes — en de kolibrie verschijnt</figcaption>
    </figure>

    <figure class="step">
      <span class="eyebrow">De laatste lijnen</span>
      <img src="assets/kolibri-oog-pencil.jpg" alt="Een hand met een houtskoolpotlood werkt aan de wimpers van het oog" loading="lazy">
      <figcaption>Wimper voor wimper</figcaption>
    </figure>

    <figure class="step">
      <span class="eyebrow">Af</span>
      <picture>
        <source media="(max-width: 640px)" srcset="assets/kolibri-oog-skew_sm.jpeg">
        <img src="assets/kolibri-oog-skew_lg.jpeg" alt="De voltooide tekening schuin van opzij gefotografeerd, nog zonder lijst" loading="lazy">
      </picture>
      <figcaption>Klaar, nog zonder lijst</figcaption>
    </figure>

    <figure class="step">
      <span class="eyebrow">Het resultaat</span>
      <picture>
        <source media="(max-width: 640px)" srcset="assets/kolibri-oog-art_sm.jpg">
        <img src="assets/kolibri-oog-art_lg.jpg" alt="De ingelijste houtskooltekening aan de muur" loading="lazy">
      </picture>
      <figcaption>Ingelijst, aan de muur</figcaption>
    </figure>

    <footer>
      <a class="back" href="index.html">← Terug naar het werk</a>
    </footer>
  </main>
  <script data-goatcounter="https://kolibri-oog.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
